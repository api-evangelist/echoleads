name: EchoLeads
description: >-
  EchoLeads is an autonomous AI voice sales platform out of T-Hub, Hyderabad, India, that replaces manual SDR work with
  AI agents running a full omnichannel workflow: outbound cold calling and inbound response, real-time BANT
  qualification, WhatsApp Business follow-up, Instagram DM lead capture, live intent-based lead scoring, human handoff,
  CRM sync, and calendar booking during the call. It sells into real estate, insurance, SaaS, healthcare, financial
  services and e-commerce, supports English, Hindi and regional Indian languages, and claims TRAI-compliant outbound
  calling. It is backed by Google for Startups, T-Hub and Math Nuage (DST, Government of India). Agent-native surface is
  real and verified — a live llms.txt, a full llms-full.txt content index, an RFC 9116 security.txt, and an
  AI-crawler-permissive robots.txt. The API surface is not: a REST API is self-declared in llms-full.txt (trigger calls,
  retrieve transcripts, push lead scores) but the documentation page returns 502, api.echoleads.ai has no listener, and
  no OpenAPI, AsyncAPI, GraphQL SDL, Postman collection or MCP server is published on any host.
