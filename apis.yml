apis:
  - name: EchoLeads Platform
    description: >-
      EchoLeads provider surfaces. The agent-native artifacts (llms.txt, llms-full.txt, security.txt) are confirmed
      publicly reachable and are saved verbatim in this repo. A REST API for triggering calls, retrieving transcripts
      and pushing lead scores is self-described in llms-full.txt, but https://echoleads.ai/resources/api-documentation
      returns 502 Bad Gateway on repeated probes, api.echoleads.ai resolves to an AWS ap-south-1 address with TCP 80 and
      443 both closed, and no base URL, auth model or machine-readable contract is published anywhere. The baseURL below
      is the website root, which is what the provider publishes — it is not a verified API host.
